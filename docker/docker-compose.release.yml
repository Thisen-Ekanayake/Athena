services:
  web:
    image: ghcr.io/thisen-ekanayake/athena/api:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://athena:athena_password@db:5432/athena_db
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - db
      - redis
      - qdrant

  worker:
    image: ghcr.io/thisen-ekanayake/athena/worker:latest
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://athena:athena_password@db:5432/athena_db
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - redis
      - db
      - qdrant
    volumes:
      - athena_staging:/tmp/athena/staging

  frontend:
    image: ghcr.io/thisen-ekanayake/athena/frontend:latest
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - web

  db:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena_password
      POSTGRES_DB: athena_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
  athena_staging:
