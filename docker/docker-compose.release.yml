services:
  web:
    image: ghcr.io/thisen-ekanayake/athena/api:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://athena:athena_password@db:5432/athena_db
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      # The model server runs on the host, where the GPU is (config/llama-router.ini); LLM_BASE_URL wins.
      LLM_DEFAULT_BASE_URL: http://host.docker.internal:8080/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis
      - qdrant

  worker:
    image: ghcr.io/thisen-ekanayake/athena/worker:latest
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://athena:athena_password@db:5432/athena_db
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      # Stage on the shared volume regardless of .env's value, so the summary worker can read it.
      ATHENA_STAGING_DIR: /tmp/athena/staging
      GROBID_URL: http://grobid:8070
      LLM_DEFAULT_BASE_URL: http://host.docker.internal:8080/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - db
      - qdrant
    volumes:
      - athena_staging:/tmp/athena/staging

  # Summaries and cluster labels, one at a time (the model server answers one request at a time).
  summary:
    image: ghcr.io/thisen-ekanayake/athena/worker:latest
    restart: unless-stopped
    command: celery -A athena.pipeline.tasks worker --loglevel=info --pool=solo -c 1 -n summary@%h -Q summary_urgent,summary_standard,summary_lazy,summary_cluster,summary_trend
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://athena:athena_password@db:5432/athena_db
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      ATHENA_STAGING_DIR: /tmp/athena/staging
      LLM_DEFAULT_BASE_URL: http://host.docker.internal:8080/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - db
    volumes:
      - athena_staging:/tmp/athena/staging

  # Research-evolution topic builds, full text and the GPU lane: one at a time, on the host's model server.
  # PDFs, TEI files and the OpenAlex and Semantic Scholar caches live in /root/.athena.
  evolution:
    image: ghcr.io/thisen-ekanayake/athena/worker:latest
    restart: unless-stopped
    command: celery -A athena.pipeline.tasks worker --loglevel=info --pool=solo -c 1 -n evolution@%h -Q evolution
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://athena:athena_password@db:5432/athena_db
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      GROBID_URL: http://grobid:8070
      LLM_DEFAULT_BASE_URL: http://host.docker.internal:8080/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - db
      - qdrant
      - grobid
    volumes:
      - athena_evolution:/root/.athena

  frontend:
    image: ghcr.io/thisen-ekanayake/athena/frontend:latest
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - web

  db:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena_password
      POSTGRES_DB: athena_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  # Parses Tier 2 PDFs for the research-evolution full-text job.
  grobid:
    image: grobid/grobid:0.9.1-crf
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  athena_staging:
  athena_evolution:
