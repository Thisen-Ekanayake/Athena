services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: uvicorn athena.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: ../.env
    environment:
      ATHENA_UPLOADS_DIR: /var/lib/athena/uploads  # projects' and chats' files
      DATABASE_URL: postgresql://athena:athena_password@db:5432/athena_db
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      # The model server runs on the host, where the GPU is (config/llama-router.ini); LLM_BASE_URL wins.
      LLM_DEFAULT_BASE_URL: http://host.docker.internal:8080/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis
      - qdrant
    volumes:
      - athena_uploads:/var/lib/athena/uploads
      - ..:/app

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    command: celery -A athena.pipeline.tasks worker --loglevel=info --pool=threads -B
    env_file: ../.env
    environment:
      ATHENA_UPLOADS_DIR: /var/lib/athena/uploads  # projects' and chats' files
      DATABASE_URL: postgresql://athena:athena_password@db:5432/athena_db
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      # Keep container staging on the mounted volume regardless of .env's value.
      ATHENA_STAGING_DIR: /tmp/athena/staging
      GROBID_URL: http://grobid:8070
      LLM_DEFAULT_BASE_URL: http://host.docker.internal:8080/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - db
      - qdrant
    volumes:
      - athena_uploads:/var/lib/athena/uploads
      - ..:/app
      - athena_staging:/tmp/athena/staging

  # Summaries and cluster labels, one at a time (the model server answers one request at a time).
  summary:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    command: celery -A athena.pipeline.tasks worker --loglevel=info --pool=solo -c 1 -n summary@%h -Q summary_urgent,summary_standard,summary_lazy,summary_cluster
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://athena:athena_password@db:5432/athena_db
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      ATHENA_STAGING_DIR: /tmp/athena/staging
      LLM_DEFAULT_BASE_URL: http://host.docker.internal:8080/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - db
    volumes:
      - ..:/app
      - athena_staging:/tmp/athena/staging

  # Research-evolution topic builds, full text and the GPU lane: one at a time, on the host's model server.
  # PDFs, TEI files and the OpenAlex and Semantic Scholar caches live in /root/.athena.
  evolution:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    command: celery -A athena.pipeline.tasks worker --loglevel=info --pool=solo -c 1 -n evolution@%h -Q evolution
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://athena:athena_password@db:5432/athena_db
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      GROBID_URL: http://grobid:8070
      LLM_DEFAULT_BASE_URL: http://host.docker.internal:8080/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - db
      - qdrant
      - grobid
    volumes:
      - ..:/app
      - athena_evolution:/root/.athena

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - web

  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena_password
      POSTGRES_DB: athena_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    restart: always
    # Enable AOF so queued work survives a redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # Parses Tier 2 PDFs for the research-evolution full-text job (athena/evolution/fulltext.py).
  # The CRF image is CPU only; natively run workers reach it at http://localhost:8070.
  grobid:
    image: grobid/grobid:0.9.1-crf
    restart: always
    ports:
      - "8070:8070"

volumes:
  athena_uploads:
  # Explicit names pin the data to these exact volumes regardless of the Compose
  # project name / launch directory, so the stack can never silently start
  # against a different, empty volume set.
  postgres_data:
    name: docker_postgres_data
  qdrant_data:
    name: docker_qdrant_data
  redis_data:
    name: docker_redis_data
  athena_staging:
    name: docker_athena_staging
  athena_evolution:
    name: docker_athena_evolution
