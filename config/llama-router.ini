; Presets for llama-server in router mode: one OpenAI-compatible endpoint for every model Athena uses.
;
;   llama-server --models-preset config/llama-router.ini --models-max 1 --port 8080
;
; Run it from the repository root (model paths are relative to it). With --models-max 1 only one model
; is on the GPU at a time: a request for the other model waits until the loaded one is idle, then the
; router swaps them. The 9B (5.7 GB) and the embedder (4.7 GB) do not fit an 8 GB card together.
;
; Section names are the model names Athena sends (LLM_CHAT_MODEL, CHAT_VISION_MODEL, EMBED_MODEL). Chats list every
; section but the embedder and the vision preset; CHAT_REASONING_MODELS says which ones think.

version = 1

[*]
n-gpu-layers = 99
parallel = 1

[qwen3.5-9b]
model = models/Qwen3.5-9B-Q4_K_M.gguf
; Q&A sends up to 16k tokens of a paper plus the conversation.
ctx-size = 20480
jinja = true
; Thinking is switched per request; the budget only guards against a template that ignores that.
reasoning-budget = 512

; Chat messages with images (CHAT_VISION_MODEL): the same GGUF with its vision projector (0.9 GB). A preset of its
; own, so text chats keep the full context without the projector's VRAM; the router swaps it in when an image comes.
[qwen3.5-9b-vision]
model = models/Qwen3.5-9B-Q4_K_M.gguf
mmproj = models/mmproj-F16.gguf
; The 9B and the projector do not fit 8 GB together beside a desktop: the projector encodes images on the CPU.
no-mmproj-offload = true
ctx-size = 12288
jinja = true
reasoning-budget = 512

[qwen3-embedding-8b]
model = models/Qwen3-Embedding-8B-Q4_K_M.gguf
embedding = true
pooling = last
ctx-size = 2048
batch-size = 2048
ubatch-size = 1024
