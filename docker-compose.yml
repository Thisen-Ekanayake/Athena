services:
  web:
    build: .
    command: uvicorn athena.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://athena:athena_password@db:5432/athena_db
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - db
      - redis
      - qdrant
    volumes:
      - .:/app

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: celery -A athena.pipeline.tasks worker --loglevel=info --pool=threads -B
    env_file: .env
    environment:
      DATABASE_URL: postgresql://athena:athena_password@db:5432/athena_db
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - redis
      - db
      - qdrant
    volumes:
      - .:/app
      - athena_staging:/tmp/athena/staging

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - web

  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena_password
      POSTGRES_DB: athena_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    restart: always
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
  athena_staging:
