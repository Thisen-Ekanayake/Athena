# Alembic: database migrations (athena/database/migrate.py runs them on startup and in setup).
#
#   alembic upgrade head                                  bring the database up to date
#   alembic revision --autogenerate -m "what changed"     write a revision from a change to athena/core/models.py
#   alembic check                                         fail if the models and the database differ
#
# The database is DATABASE_URL (from .env), read in alembic/env.py.

[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
