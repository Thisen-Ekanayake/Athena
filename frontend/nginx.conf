server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The API service, resolved through Docker's DNS on each request, so nginx starts before the API
    # and keeps working when the API container restarts with a new address.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api http://web:8000;

    # The API, on the same origin as the app: the session cookie and share links work on any host.
    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Ask-a-map and paper Q&A stream their answers as server-sent events; model calls can be slow
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # API docs (off unless DOCS_ENABLED is set on the API)
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Serve static assets with long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # All other routes fall through to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
